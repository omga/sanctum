# Supabase project config for the advisor proxy.
#
# Minimal on purpose. This project has no database, no auth and no
# storage — it exists to hold one Edge Function, because a model API key
# cannot ship in a binary. Adding tables here later is how astrologer
# chat starts; nothing about the advisor needs them.

project_id = "sanctum-advisor"

[functions.advisor]
# The platform key check stays ON.
#
# It is called `verify_jwt`, and the name is now misleading: publishable
# keys (`sb_publishable_…`) are short strings rather than JWTs. The
# platform check accepts them on the `apikey` header anyway, so a
# legitimate client passes and a bare curl with no key does not.
#
# Passing it is **not** authentication, and Supabase's own docs say so.
# The key ships in the binary and anybody can read it out. This is one
# cheap filter in front of an endpoint that costs money per request; the
# gates that matter are the rate limiter and, once it exists,
# entitlement.
verify_jwt = true
entrypoint = "./functions/advisor/index.ts"
