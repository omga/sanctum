name: sanctum
description: "Sanctum — your personal sacred space."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # ── State & DI ────────────────────────────────────────────────
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # ── Routing ───────────────────────────────────────────────────
  go_router: ^17.5.0

  # ── Models ────────────────────────────────────────────────────
  # dart_mappable replaces freezed + json_serializable + json_annotation in
  # ONE package: copyWith, ==/hashCode, toString, and JSON codecs.
  # Chosen over freezed because stable freezed (3.2.5) caps analyzer at <11,
  # which is incompatible with the analyzer-13 ecosystem that build_runner
  # 2.16 and riverpod_generator 4.x require; only freezed 4.0.0-dev.* supports
  # analyzer 13. dart_mappable 4.9.0 supports it on a stable release.
  dart_mappable: ^4.8.0

  # Used directly by core/result for @immutable.
  meta: ^1.16.0

  # ── Local persistence ─────────────────────────────────────────
  # NOTE: sqlite3_flutter_libs is END-OF-LIFE (0.6.0+eol). package:sqlite3
  # v3+ bundles the native libraries itself. Most Drift tutorials are stale.
  drift: ^2.34.3
  sqlite3: ^3.5.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5

  # ── Audio ─────────────────────────────────────────────────────
  just_audio: ^0.10.6
  audio_service: ^0.18.19

  # ── Presentation ──────────────────────────────────────────────
  flutter_animate: ^4.5.2
  share_plus: ^13.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  posthog_flutter: ^5.36.2
  sentry_flutter: ^9.27.0
  purchases_flutter: ^10.9.0

  # ── Platform ──────────────────────────────────────────────────
  # NOTE: flutter_local_notifications (above) forces Android core-library
  # desugaring — see android/app/build.gradle.kts — and pulls in
  # POST_NOTIFICATIONS / SCHEDULE_EXACT_ALARM / RECEIVE_BOOT_COMPLETED.
  # SCHEDULE_EXACT_ALARM is deliberately NOT declared: reminders use
  # inexactAllowWhileIdle precisely so that Play Console policy
  # declaration is never needed. Do not "fix" that by adding it.

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # NOTE: riverpod_lint is NOT a dev_dependency. Since 3.x it uses Dart's
  # native analysis_server_plugin system and is declared in the top-level
  # `plugins:` key of analysis_options.yaml. custom_lint is no longer needed.
  very_good_analysis: ^10.3.0

  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  dart_mappable_builder: ^4.9.0
  drift_dev: ^2.34.5
  go_router_builder: ^4.4.0

  mocktail: ^1.0.5
  alchemist: ^0.14.0

  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/brand/

  # Variable fonts: one file per family covers every weight, selected at
  # runtime via FontVariation('wght', ...) in SanctumTypography.
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    # Astrological glyphs (U+2648-2653). Without this the platform draws
    # them from its emoji font as coloured tiles — different on iOS and
    # Android, and clashing with the type either way.
    - family: SanctumSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols-Variable.ttf

  shaders:
    - shaders/aurora.frag

# Placeholder brand mark. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0616"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
